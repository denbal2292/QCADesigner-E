name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The AppImage only runs on systems with the same or a newer glibc than this.
    container: ubuntu:22.04
    steps:
      - name: Install build requirements
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk2.0-dev gettext shared-mime-info \
            git file curl ca-certificates xvfb xauth

      - uses: actions/checkout@v4

      - name: Build
        run: QCADesignerE/packaging/appimage/build-appimage.sh

      - name: Check that it starts and finds its icons
        run: |
          status=0
          timeout 20 xvfb-run -a ./QCADesignerE-x86_64.AppImage --appimage-extract-and-run \
            circuits/USE_charac_MAJ_classic.qca > start.log 2>&1 || status=$?
          cat start.log
          # 124 means it was still running when timeout stopped it.
          test "$status" = 124
          if grep -E "Couldn't find pixmap|Failed to load|CRITICAL" start.log; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: QCADesignerE-x86_64.AppImage
          path: QCADesignerE-x86_64.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Keep LF line endings, which the shell scripts and configure need
      - name: Configure git
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make git zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk2
            mingw-w64-ucrt-x86_64-gettext-runtime
            mingw-w64-ucrt-x86_64-nsis

      - name: Build
        run: QCADesignerE/packaging/windows/build-windows.sh

      - name: Check that it starts
        shell: pwsh
        run: |
          Expand-Archive (Get-Item QCADesignerE-*-windows-x86_64.zip) -DestinationPath start-test
          $exe = Get-ChildItem start-test -Recurse -Filter QCADesignerE.exe | Select-Object -First 1
          $design = Join-Path $env:GITHUB_WORKSPACE 'circuits\USE_charac_MAJ_classic.qca'
          $app = Start-Process $exe.FullName -ArgumentList "`"$design`"" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "QCADesignerE exited early with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id

      - uses: actions/upload-artifact@v4
        with:
          name: QCADesignerE-windows-x86_64
          path: |
            QCADesignerE-*-windows-x86_64.zip
            QCADesignerE-*-windows-x86_64-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish the release
        run: |
          gh release create "$GITHUB_REF_NAME" QCADesignerE-x86_64.AppImage \
            QCADesignerE-*-windows-x86_64.zip QCADesignerE-*-windows-x86_64-setup.exe \
            --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
